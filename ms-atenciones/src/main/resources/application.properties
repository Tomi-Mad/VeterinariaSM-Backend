spring.application.name=ms-atenciones
server.port=8084

# --- Base de datos propia de este microservicio (MySQL en XAMPP) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vet_atenciones?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=America/Santiago

# --- JWT: mismo secreto que ms-usuarios ---
app.jwt.secret=${JWT_SECRET:veterinaria-san-marcos-clave-secreta-de-desarrollo-cambiar-en-produccion}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Comunicación con ms-pacientes (valida que la mascota exista) ---
app.pacientes.url=${PACIENTES_URL:http://localhost:8082}

springdoc.swagger-ui.path=/swagger-ui.html