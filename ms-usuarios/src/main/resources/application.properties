spring.application.name=ms-usuarios
server.port=8081

# --- Base de datos (MySQL en XAMPP). Se puede sobreescribir con variables de entorno (Docker/AWS) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vet_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# IMPORTANTE: en producción (AWS) definir JWT_SECRET como variable de entorno. Mínimo 32 caracteres.
# Los otros microservicios deben usar EL MISMO secreto para validar los tokens.
app.jwt.secret=${JWT_SECRET:veterinaria-san-marcos-clave-secreta-de-desarrollo-cambiar-en-produccion}
app.jwt.access-expiration-minutes=30
app.jwt.refresh-expiration-days=7

# --- CORS (URL del frontend React) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Administrador inicial (se crea solo si no existe ningún usuario) ---
app.admin.email=${ADMIN_EMAIL:admin@sanmarcos.cl}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
