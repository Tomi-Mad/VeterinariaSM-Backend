spring.application.name=ms-pacientes
server.port=8082

# --- Base de datos propia de este microservicio (MySQL en XAMPP) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vet_pacientes?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT: DEBE ser exactamente el mismo secreto que usa ms-usuarios ---
app.jwt.secret=${JWT_SECRET:veterinaria-san-marcos-clave-secreta-de-desarrollo-cambiar-en-produccion}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc.swagger-ui.path=/swagger-ui.html
