# Levanta MySQL + los 3 microservicios:   docker compose up --build
# (MySQL queda en el puerto 3307 del PC para no chocar con el MySQL de XAMPP en 3306)
services:
  mysql:
    image: mysql:8.4
    container_name: vet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-vetroot123}
    ports:
      - "3307:3306"
    volumes:
      - vet-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-vetroot123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-usuarios:
    build: ./ms-usuarios
    container_name: vet-ms-usuarios
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vet_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-vetroot123}
      JWT_SECRET: ${JWT_SECRET:-veterinaria-san-marcos-clave-secreta-de-desarrollo-cambiar-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sanmarcos.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345}
    depends_on:
      mysql:
        condition: service_healthy

  ms-pacientes:
    build: ./ms-pacientes
    container_name: vet-ms-pacientes
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vet_pacientes?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-vetroot123}
      JWT_SECRET: ${JWT_SECRET:-veterinaria-san-marcos-clave-secreta-de-desarrollo-cambiar-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      mysql:
        condition: service_healthy

  ms-citas:
    build: ./ms-citas
    container_name: vet-ms-citas
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vet_citas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-vetroot123}
      JWT_SECRET: ${JWT_SECRET:-veterinaria-san-marcos-clave-secreta-de-desarrollo-cambiar-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PACIENTES_URL: http://ms-pacientes:8082
    depends_on:
      mysql:
        condition: service_healthy
      ms-pacientes:
        condition: service_started

volumes:
  vet-mysql-data:
