spring.application.name=ms-citas
server.port=8083

# --- Base de datos propia de este microservicio (MySQL en XAMPP) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vet_citas?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=America/Santiago

# --- JWT: mismo secreto que ms-usuarios ---
app.jwt.secret=${JWT_SECRET:veterinaria-san-marcos-clave-secreta-de-desarrollo-cambiar-en-produccion}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Comunicación con ms-pacientes (valida que la mascota exista y sea del dueño) ---
app.pacientes.url=${PACIENTES_URL:http://localhost:8082}

# --- Reglas de la agenda (lunes a sábado) ---
app.citas.hora-apertura=09:00
app.citas.hora-cierre=18:00
app.citas.minutos-bloque=30
# Cupos por bloque horario = número de veterinarios que atienden en paralelo (la clínica tiene 3)
app.citas.capacidad-por-bloque=3
app.citas.dias-maximo-anticipacion=90

springdoc.swagger-ui.path=/swagger-ui.html
